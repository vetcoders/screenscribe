# XcodeGen spec for the Mac App Store build of Screenscribe.
#
#   cd macos && xcodegen generate --spec Config/project.yml --project .
#
# Spec paths (sources, packages, StoreKit file) are relative to this file;
# build-setting paths use $(SRCROOT), i.e. macos/ when generated as above.
# The generated Screenscribe.xcodeproj is gitignored (macos/.gitignore); this
# spec, Package.swift and Config/* are the source of truth. Info.plist and the
# entitlements are referenced through build settings only, so XcodeGen never
# rewrites them.
name: Screenscribe

options:
  bundleIdPrefix: io.vetcoders
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  ScreenscribePackage:
    path: ..

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Screenscribe:
    type: application
    platform: macOS
    sources:
      - path: ../Sources/ScreenscribeApp
    dependencies:
      - package: ScreenscribePackage
        product: ScreenscribeCore
    settings:
      base:
        PRODUCT_NAME: Screenscribe
        PRODUCT_BUNDLE_IDENTIFIER: io.vetcoders.screenscribe
        INFOPLIST_FILE: $(SRCROOT)/Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: $(SRCROOT)/Config/Screenscribe.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: $(SRCROOT)/Config/ScreenscribeAppStore.entitlements

schemes:
  Screenscribe:
    build:
      targets:
        Screenscribe: all
    run:
      config: Debug
      storeKitConfiguration: Screenscribe.storekit
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
