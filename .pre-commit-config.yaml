# Pre-commit hooks for Screenscribe
# Install: uv run pre-commit install
# Run manually: uv run pre-commit run --all-files
#
# Built by Vetcoders

repos:
  # Ruff - fast Python linter & formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Bandit - security linter
  # Local (not the remote PyCQA/bandit repo): runs the same bandit as
  # `make verify`. The remote hook's pbr-based build shells out to
  # `git describe` using the GIT_DIR git exports for hook installs, which
  # hits our non-PEP440 tag `v0.1.19-pypi-recovery-1` and raises
  # InvalidVersion, breaking hook install from inside a git hook.
  - repo: local
    hooks:
      - id: bandit
        name: bandit
        entry: uv run bandit -c pyproject.toml
        language: system
        types: [python]
        require_serial: true

  # Semgrep - static analysis against the local pinned ruleset (semgrep.yml).
  # Deliberately not `--config auto`: that pulls ~3000 registry rules over the
  # network on every commit, reports metrics upstream, and fans out one
  # semgrep-core process per CPU core. The local set runs offline in <1s.
  - repo: https://github.com/semgrep/semgrep
    rev: v1.146.0
    hooks:
      - id: semgrep
        args: [--config, semgrep.yml, --error, --metrics=off]
        # Don't scan vendored, minified third-party (JSZip): findings in
        # upstream library code are noise, not our code.
        exclude: ^screenscribe/html_pro_assets/vendor/

  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^screenscribe/html_pro_assets/vendor/
      - id: end-of-file-fixer
        exclude: ^screenscribe/html_pro_assets/vendor/
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key
      - id: check-merge-conflict

  # Check for secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        # Vendored, minified third-party (JSZip) trips entropy heuristics; it
        # is not where our secrets live. The vendored copy is tracked in git
        # and its provenance (source URL, SHA256, SRI at vendoring time) is
        # recorded in html_pro_assets/vendor/JSZIP_SOURCE.txt + README.md.
        # site/demo/ is NOT excluded: a real secret pushed into the generated
        # demo report must be caught (fail-closed). Its benign high-entropy
        # assets are pinned per-file in .secrets.baseline, never blanket-skipped.
        exclude: ^screenscribe/html_pro_assets/vendor/
